# memfw-adapter-graphrag: a Deriver over Microsoft GraphRAG (MIT, CLI pinned
# 3.3.0) run as an offline batch subprocess. It stages shareable documents
# from a `memfw projection export` generation, runs `graphrag index` only when
# the operator calls it, and reads GraphRAG's CSV output tables back into a
# DerivedView. Standard library only; depends on memfw-ports. GraphRAG is
# installed by the operator in its own environment; memfw never imports,
# vendors or starts it, and never imports this package.
#
# Build a wheel:  uv build --wheel --package memfw-adapter-graphrag
[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "memfw-adapter-graphrag"
version = "0.1.0"
description = "GraphRAG batch Deriver for memfw (projection export in, CSV tables out)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
# Symlinks to memfw's own LICENSE and NOTICE (one copy of the text).
license-files = ["LICENSE", "NOTICE"]
dependencies = ["memfw-ports==0.4.0"]

[project.entry-points."memfw.adapters"]
graphrag = "memfw_adapter_graphrag:SPEC"

[tool.uv.sources]
memfw-ports = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/memfw_adapter_graphrag"]
