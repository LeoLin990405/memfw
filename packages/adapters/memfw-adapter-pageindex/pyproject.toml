# memfw-adapter-pageindex: a RecallProvider that searches long documents
# (Knowledge-Hub notes, PDF attachments) the PageIndex way: a model reasons
# over each document's table-of-contents tree and picks sections or pages.
# The trees use PageIndex's JSON tree format (VectifyAI/PageIndex, MIT); no
# PageIndex code is imported or copied. Depends on memfw-ports (nothing else
# of memfw) and PyYAML (MIT), which reads a note's frontmatter exactly as
# memfw reads it. Any model call goes through a memfw
# ModelBackend. memfw itself never imports this package.
#
# Build a wheel:  uv build --wheel --package memfw-adapter-pageindex
[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "memfw-adapter-pageindex"
version = "0.1.1"
description = "PageIndex-style reasoning tree search over long documents, as a memfw RecallProvider"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
# Symlinks to memfw's own LICENSE and NOTICE (one copy of the text).
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "memfw-ports==0.3.0",
    # a note's frontmatter is read with yaml.safe_load, as memfw reads it (MIT);
    # pinned to the version uv.lock resolves.
    "PyYAML==6.0.3",
]

[project.scripts]
memfw-pageindex = "memfw_adapter_pageindex.cli:main"

[project.entry-points."memfw.adapters"]
pageindex = "memfw_adapter_pageindex:adapter_spec"

[tool.uv.sources]
memfw-ports = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/memfw_adapter_pageindex"]
