[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "memfw"
version = "0.1.0"
description = "A local-first, event-backed Markdown memory vault skeleton"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["pydantic>=2.8", "PyYAML>=6.0", "typer>=0.12", "zstandard>=0.23", "filelock>=3.15", "jieba>=0.42.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "types-PyYAML>=6.0"]

[project.scripts]
memfw = "memfw.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/memfw"]
artifacts = ["src/memfw/agents/prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = ["src", "scripts"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "mem0",
    "mem0.*",
    "ollama",
    "ollama.*",
    "langchain_ollama",
    "langchain_ollama.*",
    "langgraph",
    "langgraph.*",
    "langmem",
    "langmem.*",
    "memos",
    "memos.*",
]
ignore_missing_imports = true

