[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "memfw"
version = "0.3.0"
description = "A local-first, event-backed Markdown memory vault for long-lived AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["pydantic>=2.8", "PyYAML>=6.0", "typer>=0.12", "zstandard>=0.23", "filelock>=3.15", "jieba>=0.42.1"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "sqlite-vec>=0.1.9",
]
notes = ["sqlite-vec>=0.1.9"]

[project.scripts]
memfw = "memfw.cli:app"
memfw-mcp = "memfw.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/memfw"]
artifacts = ["src/memfw/agents/prompts/*.txt", "src/memfw/eval_data/**/*.json"]

[tool.hatch.build.targets.wheel.force-include]
"scripts/memfw_readonly_service.py" = "memfw/memfw_readonly_service.py"

# Standalone wheels built from this tree (docs/ports-and-recall.md section 1.1).
# memfw does not depend on them: it keeps shipping src/memfw/ports and
# src/memfw/recall itself. Adapters (packages/adapters/*) are separate
# distributions memfw never imports; the operator installs and enables them.
[tool.uv.workspace]
members = [
    "packages/memfw-ports",
    "packages/memfw-recall",
    "packages/adapters/memfw-adapter-deepseek",
    "packages/adapters/memfw-adapter-bm25s",
    "packages/adapters/memfw-adapter-qdrant",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = ["src", "scripts"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "mem0",
    "mem0.*",
    "ollama",
    "ollama.*",
    "langchain_ollama",
    "langchain_ollama.*",
    "langgraph",
    "langgraph.*",
    "langmem",
    "langmem.*",
    "memos",
    "memos.*",
]
ignore_missing_imports = true

