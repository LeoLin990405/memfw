name: CI
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the architecture allowlist is checked against its
          # merge-base with origin/main (tests/test_architecture_layers.py).
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - run: pytest
      - run: ruff check src/memfw tests
      - run: mypy src
